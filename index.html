<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch chuẩn bị đám cưới</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bố cục: trục luồng trái sang phải → bộ ghép ngày ăn hỏi với ngày cưới → nhánh việc
   → ghi chú tuổi → chi phí. Màu kẹo: hồng phấn, xanh bạc hà, vàng bơ; thêm đỏ gạch
   riêng cho mức "nên tránh" để không lẫn với màu nhấn. */
:root{
  --bg:#fff5f7; --surface:#ffffff; --ink:#4a2a39; --muted:#836674; --line:#f6dbe2; --wire:#e4a3b6;
  --rose:#c9335f; --rose-soft:#ffe3eb;
  --mint:#1b7f5d; --mint-soft:#dbf6eb;
  --butter:#8a5c00; --butter-soft:#fff1c9;
  --danger:#a3271b; --danger-soft:#ffe0da;
  --on-rose:#ffffff; --shadow:0 6px 20px rgba(201,51,95,.10);
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#23151c; --surface:#2f1f28; --ink:#fdeef3; --muted:#cfb0bd; --line:#4b3541; --wire:#8f6475;
    --rose:#ff8fb0; --rose-soft:#57263b;
    --mint:#7fe0b9; --mint-soft:#1e4537;
    --butter:#f6cf72; --butter-soft:#43340f;
    --danger:#ff9e8c; --danger-soft:#4e241c;
    --on-rose:#2a121d; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#23151c; --surface:#2f1f28; --ink:#fdeef3; --muted:#cfb0bd; --line:#4b3541; --wire:#8f6475;
  --rose:#ff8fb0; --rose-soft:#57263b;
  --mint:#7fe0b9; --mint-soft:#1e4537;
  --butter:#f6cf72; --butter-soft:#43340f;
  --danger:#ff9e8c; --danger-soft:#4e241c;
  --on-rose:#2a121d; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background:radial-gradient(620px 300px at 8% -60px,var(--rose-soft),transparent 70%),radial-gradient(520px 280px at 96% -40px,var(--butter-soft),transparent 70%),var(--bg);background-repeat:no-repeat}
.wrap{max-width:1180px;margin:0 auto;padding:26px 18px 70px;display:flex;flex-direction:column;gap:34px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(26px,4.4vw,36px);font-weight:700}
h2{font-size:25px;font-weight:700}
h3{font-size:18px;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.sec-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between;margin-bottom:14px}
.sec-head p{color:var(--muted);font-size:14.5px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

/* Đếm ngược */
.cd{display:inline-block;font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--mint-soft);color:var(--mint);white-space:nowrap}
.cd.soon{background:var(--rose-soft);color:var(--rose)}
.cd.past{background:var(--line);color:var(--muted)}

/* Nút */
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:800 14px var(--body);padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.45;cursor:default}
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--mint);border-radius:999px;width:0;transition:width .3s}
.progress-t{font-size:13.5px;color:var(--muted);margin-bottom:14px}

/* Trục luồng trái sang phải */
.track-scroll{overflow-x:auto}
.track{display:flex;align-items:flex-start;min-width:1340px;padding:34px 18px 14px}
.stop{position:relative;flex:0 0 auto;min-width:92px;padding-left:5px;padding-right:5px;display:flex;flex-direction:column;align-items:center;padding:0 0 18px;background:none;border:0;font:inherit;color:inherit;border-radius:14px}
button.stop{cursor:pointer}
.stop.term{min-width:64px}
.bub{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;transition:transform .2s,box-shadow .2s;
  background:conic-gradient(var(--mint) calc(var(--p,0)*1%),var(--line) 0)}
.bub::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.bub .emo{position:relative;font-size:27px}
.stop.key .bub::before{background:var(--rose-soft)}
.stop.tet .bub::before{background:var(--butter-soft)}
.stop.term .bub{width:46px;height:46px;margin:7px 0;background:var(--mint-soft)}
.stop.term .bub::before{display:none}
.stop.term .bub .emo{font-size:22px}
.bub .n{position:absolute;right:-5px;top:-5px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--ink);color:var(--surface);border:2px solid var(--surface)}
.stop .lb{margin-top:9px;font-size:13.5px;font-weight:800;line-height:1.25;white-space:nowrap}
.stop .dt{font-size:12px;color:var(--muted);white-space:nowrap;margin-bottom:3px}
.stop .cd{font-size:11.5px;padding:1px 8px}
.stop .tc{margin-top:4px;font-size:11.5px;font-weight:800;color:var(--butter);background:var(--butter-soft);padding:1px 8px;border-radius:999px;white-space:nowrap}
.stop .tc[hidden]{display:none}
.sbtn.sync{cursor:default;border-style:dashed}
.sbtn.sync.on{color:var(--mint);border-color:var(--mint);background:var(--mint-soft);border-style:solid}
.sbtn.sync.wait{color:var(--butter);border-color:var(--butter);background:var(--butter-soft)}
button.stop:hover .bub{transform:translateY(-3px)}
.stop[aria-pressed="true"] .bub{transform:scale(1.13);box-shadow:0 0 0 4px var(--rose-soft),0 8px 16px rgba(201,51,95,.22)}
.stop[aria-pressed="true"] .lb{color:var(--rose)}
.stop[aria-pressed="true"] .bub .n{background:var(--rose);color:var(--on-rose)}
.stop[aria-pressed="true"]::after{content:"";position:absolute;bottom:0;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top:10px solid var(--rose)}
.here{position:absolute;top:-26px;font-size:11.5px;font-weight:800;padding:1px 9px;border-radius:999px;background:var(--mint);color:var(--surface);white-space:nowrap}
.arr{position:relative;flex:1 1 0;min-width:14px;height:2px;margin-top:29px;background:repeating-linear-gradient(90deg,var(--wire) 0 6px,transparent 6px 10px)}
.arr::after{content:"";position:absolute;right:-2px;top:-4px;border:5px solid transparent;border-right:0;border-left:8px solid var(--wire)}
.arr .lab{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:800;color:var(--rose);white-space:nowrap}


/* Bộ lọc bên */
.sidebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sbtn{font:800 14px var(--body);padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.sbtn[aria-pressed="true"]{border-color:var(--rose);background:var(--rose);color:var(--on-rose)}
.sinfo{font-size:13.5px;font-weight:700;color:var(--muted)}
.wchip{font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.wCD{background:var(--rose-soft);color:var(--rose)}
.wCR{background:var(--mint-soft);color:var(--mint)}
.wCC{background:var(--butter-soft);color:var(--butter)}
.pchip{border:1.5px dashed currentColor;background:none}
.nt textarea,.padcard textarea{width:100%;margin-top:6px;font:400 14px var(--body);line-height:1.5;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical}
.nt textarea:focus,.padcard textarea:focus{border-color:var(--mint);outline:none}
.nt{margin-top:7px;max-width:64ch}
.padcard{width:100%;background:var(--butter-soft);border:2px dashed var(--butter);border-radius:18px;padding:13px 15px;max-width:66ch}
.padcard strong{font-size:14.5px;color:var(--butter)}
.note-btn{color:var(--mint)}
.note-btn:hover{background:var(--mint-soft)}
.wQ{background:var(--surface);color:var(--muted);border:2px dashed var(--wire)}
button.wchip{cursor:pointer;font-family:var(--body)}
button.wchip:hover{filter:brightness(.95)}
.task .chips{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:7px 0 0 32px}
.more{border:0;background:none;color:var(--rose);font:800 12.5px var(--body);cursor:pointer;padding:2px 4px;border-radius:8px}
.more:hover{background:var(--rose-soft)}
.lu{font-size:13.5px;line-height:1.5;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 13px;margin-top:7px;max-width:64ch}
@media (max-width:899.98px){.task .chips{margin-left:0}}

/* Cặp ngày */
.pairs{display:flex;flex-direction:column;gap:9px}
.pair{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:6px 12px;align-items:center;width:100%;padding:12px 13px;text-align:left;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:18px;cursor:pointer}
.pair:hover{border-color:var(--wire)}
.pair.sel{border-color:var(--rose);background:var(--surface);box-shadow:0 0 0 3px var(--rose-soft)}
.pair .side{display:flex;flex-direction:column;gap:2px;min-width:0}
.pair .rol{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pair .dd{font-family:var(--display);font-size:16.5px;font-weight:700;line-height:1.2}
.pair .am{font-size:12.5px;color:var(--muted)}
.pair .mid{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--wire)}
.pair .mid b{font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.pair .mid .ar{font-size:19px;line-height:1;color:var(--rose)}
.pair .foot{grid-column:1/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}
.star{font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--rose);color:var(--on-rose)}
@media (max-width:620px){
  .pair{grid-template-columns:1fr}
  .pair .mid{flex-direction:row;gap:7px;justify-content:flex-start}
  .pair .mid .ar{transform:rotate(90deg)}
}

/* Kết luận cặp ngày */
.verdict{margin-top:14px;border-radius:18px;padding:16px;border:2px solid var(--line);background:var(--bg)}
.verdict.v1{border-color:var(--mint);background:var(--mint-soft)}
.verdict.v2{border-color:var(--butter);background:var(--butter-soft)}
.verdict.v3{border-color:var(--danger);background:var(--danger-soft)}
.v-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:4px}
.v-head strong{font-family:var(--display);font-size:19px;font-weight:700}
.v-gap{font-size:13.5px;font-weight:800;color:var(--muted)}
.v-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.v-box{background:var(--surface);border-radius:14px;padding:12px 14px}
.v-box h4{margin:0 0 6px;font-size:14px;font-family:var(--display);font-weight:700}
.v-box ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:5px}
.v-box li{font-size:13.5px}
.v-box li.g::marker{content:"✓  "}
.v-box li.b::marker{content:"✕  "}
.v-box li.g{color:var(--mint)}
.v-box li.b{color:var(--danger)}
.v-box li span{color:var(--ink)}

/* Popup chi phí */
.money{display:inline-flex;align-items:center;gap:6px;font:800 13.5px var(--body);padding:4px 12px;border-radius:999px;background:var(--butter-soft);color:var(--butter);border:2px solid transparent;cursor:pointer}
.money:hover{border-color:var(--butter)}
.money.big{font-size:15px;padding:7px 15px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(40,16,27,.52);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border-radius:22px;max-width:660px;width:100%;max-height:86vh;overflow:auto;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.3);position:relative}
.mbox h3{padding-right:40px;font-size:21px}
.mbox .msub{font-size:13.5px;color:var(--muted);margin-top:2px}
.mclose{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font:800 16px var(--body);cursor:pointer}
.mclose:hover{background:var(--line)}
.mrow{display:grid;grid-template-columns:1fr 104px;gap:3px 14px;align-items:start;padding:11px 0;border-bottom:1px dashed var(--line)}
.mrow .mn{grid-column:1/2;font-weight:700;font-size:14.5px}
.mrow .md{font-size:13px;color:var(--muted);grid-column:1/2}
.mrow .mv{grid-column:2/3;grid-row:1/3;font-weight:800;text-align:right;white-space:nowrap;font-size:14px}
.mrow .mbar{grid-column:1/3;height:9px;border-radius:999px;background:var(--bg);position:relative;overflow:hidden;margin-top:5px}
.mrow .mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.mrow .mbar .hi{background:var(--rose-soft)}
.mrow .mbar .lo{background:var(--rose)}
.mtot{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:4px}
.mtot b{font-family:var(--display);font-size:19px}
.mtot .v{font-family:var(--display);font-size:22px;font-weight:700;color:var(--rose)}
.mnote{font-size:13px;color:var(--muted);margin-top:12px;border-top:2px dashed var(--line);padding-top:10px}
.knobs{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;padding:12px 0 14px;border-bottom:2px dashed var(--line);margin-bottom:4px}
.knobs label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.knobs input{font:800 16px var(--body);width:116px;padding:8px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.knobs .eq{flex:1 0 100%;font-size:14px;font-weight:700;padding:4px 0 2px;line-height:1.5}

/* Nhánh việc */
.stage{margin-top:16px}
.panel{padding:18px}
.pcard{display:flex;flex-direction:column;gap:3px;padding:16px;border-radius:20px;background:var(--bg);border:2px solid var(--line)}
.panel.key .pcard{background:var(--rose-soft);border-color:var(--wire)}
.panel.tet .pcard{background:var(--butter-soft);border-color:var(--butter)}
.pc-ico{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--surface);margin-bottom:8px}
.pcard strong{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.2}
.pcard small{font-size:13.5px;font-weight:700;color:var(--muted)}
.pcard .note{font-size:14px;color:var(--muted);margin-top:8px}
.pc-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:13.5px;font-weight:700}
.cost[hidden]{display:none}
.cost{font-size:13.5px;font-weight:800;white-space:nowrap;padding:2px 10px;border-radius:999px;background:var(--butter-soft);color:var(--butter)}
.grp{position:relative;display:flex;gap:10px;align-items:center;width:100%;min-height:54px;padding:8px 38px 8px 9px;text-align:left;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:18px;cursor:pointer}
.grp:hover,.grp[aria-expanded="true"]{border-color:var(--wire)}
.g-ico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--surface)}
.g-tx{display:flex;flex-direction:column;min-width:0}
.g-tx strong{font-size:15px;font-weight:800;line-height:1.25}
.g-tx .meta{font-size:12.5px;color:var(--muted)}
.pm{position:absolute;right:11px;top:17px;width:20px;height:20px;border-radius:50%;background:var(--rose);opacity:.9}
.pm::before,.pm::after{content:"";position:absolute;left:5px;right:5px;top:9px;height:2px;border-radius:2px;background:var(--on-rose)}
.pm::after{transform:rotate(90deg);transition:transform .2s}
[aria-expanded="true"]>.pm{background:var(--wire)}
[aria-expanded="true"]>.pm::after{transform:none}
.kids{position:relative;display:flex;flex-direction:column}
.kid{position:relative;padding-bottom:12px}
.kid::before,.kid::after{content:"";position:absolute;pointer-events:none}
.ah{position:absolute;left:-8px;top:22px;border:5px solid transparent;border-right:0;border-left:8px solid var(--wire)}
.task{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;padding:11px 13px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px}
.task label{display:flex;gap:10px;cursor:pointer;min-width:0}
.task input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--wire);border-radius:8px;background:var(--surface);display:grid;place-content:center;cursor:pointer}
.task input::after{content:"\2665\FE0E";font-size:13px;line-height:1;color:var(--on-rose);transform:scale(0);transition:transform .15s}
.task input:checked{background:var(--rose);border-color:var(--rose)}
.task input:checked::after{transform:scale(1)}
.task .tx{display:flex;flex-direction:column}
.task .tx>span{font-weight:700}
.task .tx small{font-size:13.5px;color:var(--muted)}
.task input:checked+.tx>span{text-decoration:line-through;color:var(--muted)}
.alts{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.alt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;background:var(--surface);border:1.5px dashed var(--wire);border-radius:14px;padding:9px 13px;font-size:13.5px}
.alt b{font-size:14.5px}
.alt .why{color:var(--muted);width:100%}

@media (min-width:900px){
  .tree{display:grid;grid-template-columns:252px 1fr;align-items:start}
  .kids{padding-left:44px}
  .kid:last-child{padding-bottom:0}
  .kid:first-child::before{left:-44px;top:26px;width:38px;border-top:2px solid var(--wire)}
  .kid:not(:first-child)::before{left:-22px;top:0;width:16px;height:28px;border-left:2px solid var(--wire);border-bottom:2px solid var(--wire);border-bottom-left-radius:14px}
  .kid:not(:last-child)::after{left:-22px;top:0;bottom:0;border-left:2px solid var(--wire)}
  .kid:first-child:not(:last-child)::after{top:27px}
  .grp-row{display:grid;grid-template-columns:216px 1fr;align-items:start}
}
@media (max-width:899.98px){
  .kids{padding:12px 0 0 32px}
  .l2>.kid:last-child,.l1>.kid:last-child{padding-bottom:0}
  .kid::before{left:-18px;top:-12px;width:12px;height:40px;border-left:2px solid var(--wire);border-bottom:2px solid var(--wire);border-bottom-left-radius:12px}
  .kid:not(:last-child)::after{left:-18px;top:0;bottom:0;border-left:2px solid var(--wire)}
  .task{grid-template-columns:1fr}
  .task .cost{justify-self:start;margin-left:32px}
  .panel{padding:14px}
  .mapgrid{grid-template-columns:1fr;gap:16px}
  .col-mid{padding:0}
  .col-mid .hint::before{content:"⬇ ";font-size:17px}
  .v-cols{grid-template-columns:1fr}
  #link{display:none}
}

/* Ghi chú tuổi */

@media (prefers-reduced-motion:no-preference){
  .panel:not([hidden]),.kids.l2:not([hidden]){animation:open .25s ease-out}
  @keyframes open{from{opacity:.35;translate:0 -5px}to{opacity:1;translate:0 0}}
}
</style>
</head>
<body>
<div class="wrap">

<section>
  <div class="sec-head">

function cdText(d){
  const n=days(d,today);
  if(n>0)return{t:'Còn '+n+' ngày',c:n<=30?'soon':''};
  if(n===0)return{t:'Hôm nay',c:'soon'};
  return{t:'Đã qua '+(-n)+' ngày',c:'past'};
}
const cdHTML=d=>{const c=cdText(d);return `<span class="cd num ${c.c}">${c.t}</span>`};

  if(today>=s)return{t:'Đang diễn ra, còn '+days(e,today)+' ngày',c:'soon'};

}

      {t:'Xe chở họ hàng Hà Nội – Nam Định, 2 xe 29 chỗ',w:'?',p:'CC',lu:'Chặng Hà Nội – Nam Định khoảng 85–90 km. Tiền xe không tính riêng bên nào: nhà nào có họ hàng đi xe nào thì trả phần xe đó, nếu đi chung một xe thì chia đôi.',d:'Chặng 85–90 km. Khảo sát: 2,2–2,8 tr một xe đi về trong ngày, có nơi báo 3–3,5 tr. Chưa gồm VAT và phí cao tốc khoảng 100 nghìn một lượt.',c:[5,6],dk:3,pic:'CDCR'},
      {t:'Tiết mục văn nghệ',w:'?',d:'Nhờ bạn bè đăng ký tiết mục thay vì thuê ban nhạc. Bảng gốc cũng để 0.'}]},
    {t:'Trăng mật',i:'🛫',k:[
      {t:'Chọn điểm đến và chốt lịch',w:'CC',d:'Đi trong nước cho gọn ngân sách. Nếu ra nước ngoài thì hộ chiếu và visa phải làm ngay từ bây giờ.'},
      {t:'Đặt vé và phòng cho tuần trăng mật',w:'?',d:'Đặt sớm 2–3 tháng rẻ hơn nhiều. Tiền nằm ở bước Tuần trăng mật.'},
      {t:'Xin nghỉ phép ở cơ quan cả hai bạn',w:'CC',d:''}]}]},
 {i:'🧧',sh:'Tết',t:'Tết Đinh Mùi',s:D(2027,2,6),e:D(2027,2,14),tet:1,
  note:'Mùng 1 Tết rơi vào Thứ Bảy 6/2/2027. Dịch vụ nghỉ hết, đây là dịp báo tin vui trực tiếp với họ hàng và rà lại danh sách khách.',
  g:[{t:'Trong dịp Tết',i:'🌸',k:[
      {t:'Quà Tết cho hai bên nội ngoại',w:'CC',p:'CC',d:'Không có trong bảng gốc, đây là ước tính của tôi.',c:[3,3.6],off:1},
      {t:'Mừng tuổi bố mẹ và ông bà hai bên',w:'CC',p:'CC',lu:'Mừng tuổi cho cả bố mẹ lẫn ông bà hai bên, chia đều hai bên để không nhà nào tủi.',d:'Khoản bạn chốt.',c:[3,3],off:1},
      {t:'Báo ngày cưới với ông bà, cô bác lớn tuổi',w:'CC',d:'Mời miệng trước, thiệp gửi sau.'},
      {t:'Chốt danh sách khách mời với bố mẹ hai bên',w:'CC',lu:'Mỗi nhà tự chốt danh sách của nhà mình rồi cộng lại. Con số này quyết định số mâm, số thiệp và số quà, nên sai một chút là lệch tiền rất nhiều.',d:'Mỗi nhà tự chốt danh sách của nhà mình rồi cộng lại. Mặc định trang đang tính 300 khách, tức 50 mâm 6 người.'},
      {t:'Chốt ngân sách và phân chia khoản chi',w:'CC',lu:'Dùng nút Cô dâu và Chú rể ở đầu trang để hai nhà cùng ngồi xem phần của mình. Bảng tổng chi phí có sẵn dòng cộng riêng cho từng bên. Hai điều nên tránh: dốc hết tiền tiết kiệm vào đám cưới, và trông vào tiền mừng để hoà vốn. Thực tế rất khó hoà vốn, nên cứ coi tiền mừng là phần bù thêm chứ đừng tính trước vào ngân sách.',d:'Bảng gốc chia: chi phí chung 123,55 tr, riêng cô dâu 142,88 tr, riêng chú rể 121,28 tr, đều chưa tính mâm.'}]}]},

 {i:'💌',sh:'Nước rút',t:'Nước rút',s:D(2027,2,20),e:D(2027,2,28),
  note:'Chín ngày cuối tháng 2. Lưu ý tháng 2/2027 chỉ có 28 ngày nên không có ngày 30. Sau Tết đã biết chắc số khách, giờ in thiệp, gửi thiệp và chốt số mâm. Vài việc sát ngày lễ thì làm sau mốc này, xem ghi chú từng dòng.',
  g:[{t:'Thiệp và quà, sau khi chốt khách',i:'💌',k:[
      {t:'Cô dâu chọn mẫu và đặt in thiệp',w:'CD',p:'CC',lu:'Cô dâu chọn mẫu thiệp, chất liệu, chữ nghĩa và cách xưng hô, rồi đặt in một lần cho cả hai nhà để thiệp đồng bộ. Tên bố mẹ hai bên phải soát thật kỹ trước khi bấm in, sai một chữ là phải in lại cả lô. Nhớ đặt dư khoảng 10% phòng viết hỏng và khách phát sinh. Riêng tiền in thì hai nhà chia theo số thiệp mỗi bên dùng, chứ không phải nhà gái trả hết.',d:'Với 140 mâm cỗ cưới, tức khoảng 840 khách, cần quãng 920 thiệp kể cả in dư 10%. Khảo sát 3–5 nghìn một thiệp.',c:[3,5],dk:1.55,pic:'CDCR'},
      {t:'Nhà trai viết và gửi thiệp cho khách nhà trai',w:'CR',p:'CR',lu:'Nhà trai tự viết và tự gửi thiệp cho khách của nhà mình, không gộp với nhà gái. Viết đúng tên và cách xưng hô của từng người, khách lớn tuổi thì nên đưa tận tay chứ đừng nhờ chuyển. Gửi quá sớm thì khách quên, gửi sát quá thì khách đã kín lịch và thấy bị xem nhẹ. Khoảng 3 đến 4 tuần trước ngày cưới là vừa, tuyệt đối không dưới 10 ngày. Đánh dấu lại ai đã nhận để không sót và không gửi trùng.',d:'Gửi trong khoảng 28/2 – 7/3 để thiệp đến tay khách trước ngày cưới 3–4 tuần.'},
      {t:'Nhà gái viết và gửi thiệp cho khách nhà gái',w:'CD',p:'CD',lu:'Nhà gái tự viết và tự gửi thiệp cho khách của nhà mình. Cùng mẫu thiệp với nhà trai nhưng danh sách và việc gửi là riêng. Khách ở xa thì gửi sớm hơn vài ngày, khách ở gần thì đưa tận tay. Khoảng 3 đến 4 tuần trước ngày cưới là vừa, tuyệt đối không dưới 10 ngày. Đánh dấu lại ai đã nhận để không sót và không gửi trùng.',d:'Gửi trong khoảng 28/2 – 7/3 để thiệp đến tay khách trước ngày cưới 3–4 tuần.'},
      {t:'Đặt quà tặng khách mời',w:'CD',p:'CC',lu:'Cô dâu chọn mẫu quà, còn tiền thì hai nhà chia theo số khách mỗi bên mời. Bảng tổng chi phí có dòng cộng riêng cho từng bên.',d:'Khoảng 13–15 nghìn một phần cho 840 khách dự tiệc cưới. Nếu cần cắt giảm thì đây là khoản khách ít để ý nhất.',c:[11,13],dk:5,pic:'CDCR'}]},
    {t:'Tiệc và cỗ',i:'🍽️',k:[
      {t:'Thử món và chốt đồ uống',lu:'Đừng tiếc tiền ở khoản này. Khảo sát cho thấy hai thứ khách nhớ nhất sau đám cưới là đồ ăn và âm nhạc, còn mấy chi tiết trang trí nhỏ thì gần như không ai để ý.',w:'CC',d:''},
      {t:'Chốt số mâm cuối',w:'CC',d:'Việc này làm muộn hơn mốc trên: báo cho bên nấu cỗ trước ngày cưới 5–7 ngày, tức khoảng 21/3.'},
      {t:'Xếp sơ đồ bàn theo nhóm khách',w:'CC',d:''},
      {t:'Mâm cỗ tiệc nhà trai',w:'CR',p:'CR',lu:'Theo lệ phổ biến, phần tiệc cưới mỗi bên tự tổ chức riêng tại quê hoặc nhà hàng gần nhà mình: nhà trai lo tiệc nhà trai, nhà gái lo tiệc nhà gái, và tiền mừng của khách bên nào thì bên đó giữ. Đây là khoản to nhất của cả đám cưới nên phải chốt rõ từ hôm dạm ngõ.',d:'Khách của nhà trai, dự kiến 70 mâm. Sửa số mâm và giá ở ô phía trên.',c:'tiecCR',dk:195,pic:'CR'},
      {t:'Mâm cỗ tiệc nhà gái',w:'CD',p:'CD',lu:'Tiệc riêng của nhà gái, mời khách của nhà gái. Nếu hai nhà gộp làm một tiệc chung thì đặt số mâm của một bên về 0 rồi cộng hết vào bên kia.',d:'Khách của nhà gái, dự kiến 70 mâm. Sửa số mâm và giá ở ô phía trên.',c:'tiecCD',dk:195,pic:'CD'},
      {t:'Mâm cỗ ăn hỏi nhà gái',w:'CD',p:'CD',lu:'Cỗ ngày ăn hỏi bày tại nhà gái, mời họ hàng và khách của nhà gái. Khoản này tính riêng, không nằm trong số mâm tiệc cưới. Cỗ ăn hỏi thường ít khách mừng hơn cỗ cưới nên hầu như không thu lại được, phải coi là chi thật.',d:'Dự kiến 30 mâm tại nhà gái. Sửa số mâm và giá ở ô phía trên.',c:'hoiCD',dk:10,pic:'CD'},
      {t:'Mâm cỗ ăn hỏi nhà trai',w:'CR',p:'CR',lu:'Cỗ nhà trai làm sau khi đoàn rước tráp về, mời họ hàng và đội bê tráp. Nếu nhà trai không làm cỗ hôm ăn hỏi thì đặt số mâm về 0 ở ô phía trên, chi phí sẽ tự về 0.',d:'Dự kiến 30 mâm tại nhà trai. Sửa số mâm và giá ở ô phía trên.',c:'hoiCR',pic:'CR',off:1},
      {t:'Bánh kẹo, hoa quả mời khách tại nhà gái',w:'CD',p:'CD',d:'Dùng cho cả ngày dạm ngõ, ăn hỏi và ngày vu quy.',c:[1.5,2],dk:0.6,pic:'CD'},
      {t:'Bánh kẹo, hoa quả mời khách tại nhà trai',w:'CR',p:'CR',d:'Dùng cho ngày đón dâu.',c:[1.2,1.5],pic:'CR',off:1}]},
    {t:'Nhà cửa và sính lễ',i:'🏠',k:[
      {t:'Sửa soạn phòng tân hôn',w:'CR',p:'CR',lu:'Phòng tân hôn ở nhà trai nên nhà trai lo. Nhưng cô dâu là người ở đó, nên phải được hỏi ý về chăn ga, màu sơn và cách bày.',d:'Chăn ga gối mới, rèm, đèn, sơn sửa nhỏ. Giữ lại giường tủ sẵn có cho đỡ tốn.',c:[5,5.5],off:1},
      {t:'Chuẩn bị tiền nạp tài',w:'CR',p:'CR',lu:'Khoảng chênh rất rộng tuỳ từng nhà: có nguồn ghi 10–50 triệu, có nguồn ghi miền Bắc 30–100 triệu, nơi khác chỉ 5–20 triệu. Mức 20–30 ở đây chỉ là tạm tính. Con số cụ thể đã chốt hôm dạm ngõ, đừng để đến sát ngày mới hỏi lại. Miền Bắc nhà trai thường chuẩn bị ba phong bì riêng chứ không phải một, hay gọi là lễ đen. Số tiền theo yêu cầu nhà gái đã nêu hôm dạm ngõ và theo khả năng nhà trai. Hỏi rõ nhà gái muốn ba phong bì hay một.',d:'Theo mức hai nhà đã chốt hôm dạm ngõ. Không có trong bảng gốc.',c:[20,30],off:1},
      {t:'Thử váy, vest lần cuối',lu:'Váy không vừa và nhẫn sai cỡ là hai lỗi hay gặp nhất, gần như luôn do để sát ngày mới thử. Thử xong còn thời gian sửa thì mới gọi là thử.',w:'CC',d:'Làm đầu tháng 3, sau mốc trên.'}]},
    {t:'Chốt cho cả hai lễ',i:'📋',k:[
      {t:'Lập lịch giờ chi tiết cho ngày ăn hỏi và ngày cưới',lu:'Gửi MC một tờ ghi rõ tên cô dâu, chú rể, tên bố mẹ hai bên kèm cách phát âm. Chuyện MC đọc nhầm tên suốt buổi lễ xảy ra nhiều hơn bạn nghĩ. Nếu được thì chạy thử một lượt trước ngày cưới.',w:'CC',d:'Gửi cho studio, trang điểm, xe, MC, trang trí.'},
      {t:'Phân công người nhà',w:'CC',lu:'Mỗi nhà tự phân công người của nhà mình: đón khách, giữ phong bì, lái xe, lo trẻ nhỏ. Riêng người giữ phong bì phải là người thật tin cậy và phải rõ giữ phong bì của nhà nào. Không cần làm cô dâu siêu nhân. Giao hẳn cho bạn thân một đầu việc trọn gói, ví dụ xác nhận khách và phát thiệp, rồi để họ tự lo. Giữ lại cho mình đúng mấy việc phải tự quyết.',d:'Đón khách, giữ phong bì, đội bê tráp, lái xe, lo trẻ nhỏ.'},
      {t:'Nhà trai lì xì đội nam bê tráp',w:'CR',p:'CR',lu:'Hai đội trao tráp xong thì trao lì xì cho nhau, nên hai nhà phải chuẩn bị mức tiền bằng nhau, thống nhất trước để không bên nào ngượng.',d:'Thường 100–200 nghìn một người.',c:[0.5,0.6],off:1},
      {t:'Nhà gái lì xì đội nữ đỡ tráp',w:'CD',p:'CD',lu:'Mức lì xì phải bằng với nhà trai. Hỏi nhau trước khi bỏ phong bì.',d:'Thường 100–200 nghìn một người.',c:[0.5,0.6],off:1},
      {t:'Chuẩn bị lời phát biểu của đại diện hai họ',w:'CC',lu:'Mỗi nhà tự chuẩn bị bài của đại diện nhà mình. Nhà trai nói trước xin phép, nhà gái đáp lại. Nên viết ra giấy và đưa bác đại diện đọc trước một lần.',d:''},
      {t:'Dựng rạp, trang trí gia tiên',w:'CC',lu:'Mỗi nhà dựng rạp nhà mình và phải có người của nhà đó ở nhà để chỉ chỗ cho thợ. Nhà gái dựng trước ngày ăn hỏi, nhà trai dựng trước ngày đón dâu. Cưới ở quê dựng rạp ngoài sân thì phải có phương án mưa: hỏi trước bên dựng rạp về bạt che mưa, thoát nước và chỗ kê bàn dự phòng. Cuối tháng 3 miền Bắc hay có mưa phùn.',d:'Làm trước mỗi lễ 1–2 hôm, tức khoảng 14/3 và 26/3, sau mốc trên.'},
      {t:'Kiểm tra lần cuối xe hoa, hoa cưới, nhẫn, phong bì',w:'?',d:'Làm ngày 26–27/3, sau mốc trên.'}]}]},

 {i:'🎁',sh:'ĂN HỎI',t:'Lễ ăn hỏi, nạp tài',s:H,e:H,key:1,pick:1,
  note:'Nhà trai mang tráp sang nhà gái, trao lễ nạp tài, cô dâu ra mắt hai họ.',
  g:[{t:'Trong ngày',i:'🎁',k:[
      {t:'Nhà trai mang tráp sang nhà gái',w:'CR',d:'Trao tráp, trình lễ, thắp hương gia tiên.'},
      {t:'Trao lễ nạp tài, cô dâu ra mắt hai họ',w:'CC',d:''},
      {t:'Nhà gái lại quả và mời cỗ',w:'CD',lu:'Nhà gái chia lại một phần lễ trong tráp để nhà trai mang về thắp hương. Nhớ chuẩn bị sẵn túi hoặc hộp đựng lại quả. Lại quả phải chia theo số chẵn, và theo lệ thì không dùng dao kéo để cắt lễ, chỉ xé hoặc bẻ bằng tay. Tráp khi trả lại phải để ngửa nắp, không đậy kín.',d:''},
      {t:'Chụp ảnh phóng sự lễ hỏi',w:'?',d:''},
      {t:'Phát sinh trong ngày ăn hỏi',w:'CC',p:'CC',d:'Khoản dự phòng riêng cho ngày này: thuê thêm bàn ghế, bù tiền cỗ, lì xì, đi lại, mua bù đồ thiếu.',c:[10,15],off:1}]}]},

 {i:'💒',sh:'ĐÁM CƯỚI',t:'Lễ cưới, rước dâu',s:C,e:C,key:1,pick:1,
  note:'Rước dâu theo giờ đã chọn, lễ gia tiên nhà trai, rồi tiệc cưới.',
  g:[{t:'Trong ngày',i:'💒',k:[
      {t:'Nhà trai sang xin dâu và rước dâu theo giờ đã chọn',lu:'Miền Bắc giữ lệ đi hơn về kém: lúc đoàn nhà trai xuất phát phải vào giờ hơn, tức phút còn dưới 30; lúc cô dâu bước chân từ nhà gái về phải vào giờ kém, tức phút đã qua 30. Nhớ tính cả quãng đường Hà Nội – Nam Định khi đặt giờ xuất phát.',w:'CR',d:''},
      {t:'Lễ gia tiên tại nhà trai, trao nhẫn',w:'CR',d:''},
      {t:'Tiệc cưới, chào bàn, chụp ảnh với khách',w:'CC',d:''},
      {t:'Thanh toán nhà hàng, thu gom quà và phong bì',w:'CC',lu:'Phân công rõ ai giữ phong bì của nhà nào. Theo lệ phổ biến, tiền mừng của khách bên nào thì bên đó giữ để bù tiền mâm của bên mình. Đừng trông vào tiền mừng để trả tiền mâm ngay trong ngày: nhiều khách báo đi rồi không đến, mà mâm vẫn phải trả đủ. Chuẩn bị sẵn tiền mặt đủ thanh toán, tiền mừng tính sau.',d:'Giao cho một người thân đã phân công.'},
      {t:'Phát sinh trong ngày cưới',w:'CC',p:'CC',d:'Khoản dự phòng riêng cho ngày này: bàn phát sinh, đồ uống vượt mức, thuê thêm giờ, xe bổ sung, bù tiền mâm.',c:[20,30],off:1}]}]},

 {i:'🏡',sh:'Sau cưới',t:'Sau cưới và tuần trăng mật',s:addD(C,1),e:addD(C,14),
  note:'Lại mặt và quyết toán trong tuần đầu, rồi đi trăng mật từ khoảng ngày thứ bảy sau cưới.',

function renderTrack(){
  const ni=nowIdx();
  const arr=lab=>`<span class="arr" aria-hidden="true">${lab?`<span class="lab">${lab}</span>`:''}</span>`;
  const gap=days(cuoiOf(getPair()).d,hoiOf(getPair()).d);
  track.innerHTML=PHASES.map((p,i)=>{
    const c=cdRange(p.s,p.e);
    const dt=p.s.getTime()===p.e.getTime()?full(p.s):dm(p.s)+' – '+dm(p.e);
    const node=`<button type="button" class="stop ${p.key?'key':''} ${p.tet?'tet':''}" data-i="${i}" aria-pressed="false" aria-label="Bước ${i+1}: ${p.t}">
      ${i===ni?'<span class="here">Hôm nay</span>':''}
      <span class="bub">${emo(p.i)}<span class="n num">${i+1}</span></span>
      <span class="lb">${p.sh}</span><span class="dt num">${dt}</span>
      <span class="cd num ${c.c}">${c.t}</span>
      <span class="tc num" data-tpc="${i}" hidden></span></button>`;
    return (i===0?'':arr(p.sh==='ĐÁM CƯỚI'?(gap===0?'cùng ngày':gap+' ngày'):''))+node;
  }).join('')+arr()+`<div class="stop term"><span class="bub">${emo('🎉')}</span><span class="lb">Hoàn tất</span></div>`;
  select(sel,false);
}

/* ---------- nhánh việc ---------- */
function renderStage(){
  stage.innerHTML=PHASES.map((p,i)=>{
    const open=i===sel;
    const groups=p.g.map((g,j)=>{
      const items=g.k.map((k,x)=>{
        const id=tid(k), c=amt(k);
        const w=sideOf(k);
        return `<div class="kid" data-w="${w}" ${(k.p||'CC')==='CC'&&costOf(k)?'data-sh="1"':''}><i class="ah"></i><div class="task"><label for="${id}"><input type="checkbox" id="${id}" ${state.done[id]?'checked':''}><span class="tx"><span>${esc(k.t)}</span>${k.d?`<small>${esc(k.d)}</small>`:''}</span></label><span class="cost num" data-ci="${i}-${j}-${x}" ${halfNow(k)?'title="Một nửa khoản chung, nửa kia bên nhà đối diện lo"':''} ${c?'':'hidden'}>${c?rng(c[0],c[1])+(halfNow(k)?' ½':''):''}</span><span class="chips">${k.w==='?'?`<button type="button" class="wchip assign w${w==='?'?'Q':w}" data-id="${id}" title="Bấm để đổi người chủ trì">${WN[w]}</button>`:`<span class="wchip w${w}">${WN[w]}</span>`}${k.lu?`<button type="button" class="more" aria-expanded="false" aria-controls="lu-${id}">Lưu ý …</button>`:''}<button type="button" class="more note-btn" aria-expanded="false" aria-controls="nt-${id}">✎ Ghi chú${state.notes[id]?' •':''}</button></span></div>${k.lu?`<div class="lu" id="lu-${id}" hidden>${esc(k.lu)}</div>`:''}<div class="nt" id="nt-${id}" hidden><textarea data-note="${id}" rows="3" placeholder="Ghi chú cho việc này: báo giá, tên người liên hệ, điều đã hẹn…">${esc(state.notes[id]||'')}</textarea></div></div>`;
      }).join('');
      return `<div class="kid grp-row"><i class="ah"></i><button type="button" class="grp tog" aria-expanded="${open}" aria-controls="g-${i}-${j}"><span class="g-ico">${emo(g.i)}</span><span class="g-tx"><strong>${esc(g.t)}</strong><span class="meta num" data-gc="${i}-${j}"></span></span><span class="pm"></span></button><div class="kids l2" id="g-${i}-${j}" ${open?'':'hidden'}>${items}</div></div>`;
    }).join('');
    const c=cdRange(p.s,p.e);
    const dt=p.s.getTime()===p.e.getTime()?full(p.s):dm(p.s)+' – '+dmy(p.e);
    const alt=p.alts?`<div class="kid"><i class="ah"></i><div style="width:100%"><strong style="font-size:14.5px">Các lựa chọn ngày dạm ngõ</strong><div class="alts">${p.alts.map(a=>`<div class="alt"><b>${full(a.d)}</b><span>ngày ${a.cc}</span>${a.cur?'<span class="lvl lvl2">Đang chọn</span>':''}${cdHTML(a.d)}<span class="why">${esc(a.why)}</span></div>`).join('')}</div></div></div>`:'';
    const pick=p.pick?`<div class="kid"><i class="ah"></i><div style="width:100%" class="picker"><strong style="font-size:14.5px">Chọn cặp ngày ăn hỏi và ngày cưới</strong>
      <p style="font-size:13.5px;color:var(--muted);margin:2px 0 9px">Mỗi thẻ là một cặp đã ghép sẵn. Chọn cặp nào thì toàn bộ sơ đồ và các mốc tính lại theo cặp đó. Mọi đánh giá ngày trên trang là áp dụng cơ học các quy tắc dân gian từ lịch vạn niên, không phải lời tiên đoán; ngày cuối cùng vẫn nên đưa cho người lớn trong nhà xem lại.</p>${pickerHTML()}</div></div>`:'';
    return `<div class="panel card ${p.key?'key':''} ${p.tet?'tet':''}" id="panel-${i}" ${open?'':'hidden'}><div class="tree">
      <div class="pcard"><span class="pc-ico">${emo(p.i)}</span><strong>${i+1}. ${esc(p.t)}</strong><small>${dt}</small>
        <span style="display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center"><span class="cd num ${c.c}">${c.t}</span><span data-pd="${i}" style="font-size:13px;color:var(--muted);font-weight:700"></span></span>
        ${p.note?`<p class="note">${esc(p.note)}</p>`:''}
        <span style="margin-top:10px"><button class="money" type="button" data-cost="${i}" hidden>💰 <span data-pc="${i}"></span> · chi tiết</button></span></div>
      <div class="kids l1">${pick}${groups}${alt}<div class="kid"><i class="ah"></i><div class="padcard"><strong>📝 Sổ ghi chú của hai bạn — bước ${esc(p.sh)}</strong><textarea data-pnote="${esc(p.sh)}" rows="4" placeholder="Ghi những gì hai nhà đã thống nhất, số điện thoại bên cung cấp, điều cần hỏi lại…">${esc(state.pnotes[p.sh]||'')}</textarea></div></div></div></div></div>`;
  }).join('');
  applyFilter();
}

const panel=i=>document.getElementById('panel-'+i);
const togs=i=>{const p=panel(i);return p?[...p.querySelectorAll('.tog')]:[]};
const isOpen=b=>b.getAttribute('aria-expanded')==='true';
const setOpen=(b,on)=>{b.setAttribute('aria-expanded',on);document.getElementById(b.getAttribute('aria-controls')).hidden=!on};
const nextBtn=$('#next');
const syncNext=()=>{nextBtn.disabled=sel===PHASES.length-1&&togs(sel).every(isOpen)};

function select(i,center){
  sel=Math.min(Math.max(i,0),PHASES.length-1);
  $$('#track .stop[data-i]').forEach(s=>s.setAttribute('aria-pressed',+s.dataset.i===sel));
  PHASES.forEach((_,k)=>{const el=panel(k);if(el)el.hidden=k!==sel});
  if(center){
    const s=$(`#track .stop[data-i="${sel}"]`);
    if(s)scroller.scrollTo({left:s.offsetLeft-(scroller.clientWidth-s.offsetWidth)/2,behavior:calm()?'auto':'smooth'});
  }
  syncNext();
}
track.addEventListener('click',e=>{const s=e.target.closest('.stop[data-i]');if(s)select(+s.dataset.i,true)});
$('#sidebar').addEventListener('click',e=>{
  const b=e.target.closest('.sbtn'); if(!b)return;
  state.side=b.dataset.side; save();
  $$('#sidebar .sbtn').forEach(x=>x.setAttribute('aria-pressed',x.dataset.side===state.side));
  applyFilter();
});
function applyFilter(){
  $$('#stage .kid[data-w]').forEach(el=>{el.hidden=!(state.side==='all'||el.dataset.w==='CC'||el.dataset.w===state.side||el.dataset.sh==='1')});
  refresh();
}
stage.addEventListener('click',e=>{
  const as=e.target.closest('.assign');
  if(as){
    const id=as.dataset.id, cur=state.assign[id]||'?';
    const nx=cur==='?'?'CD':cur==='CD'?'CR':null;
    if(nx)state.assign[id]=nx; else delete state.assign[id];
    const w=nx||'?';
    as.className='wchip assign w'+(w==='?'?'Q':w);
    as.textContent=WN[w];
    as.closest('.kid').dataset.w=w;
    save();applyFilter();return;
  }
  const mo=e.target.closest('.more');
  if(mo){const on=mo.getAttribute('aria-expanded')!=='true';mo.setAttribute('aria-expanded',on);mo.textContent=on?'Thu gọn lưu ý':'Lưu ý …';document.getElementById(mo.getAttribute('aria-controls')).hidden=!on;return}
  const pr=e.target.closest('.pair');
  if(pr){state.pair=pr.dataset.pair;save();PHASES=buildPhases();renderTrack();renderStage();return}
  const mb=e.target.closest('[data-cost]');
  if(mb){openPhaseCost(+mb.dataset.cost);return}
  const b=e.target.closest('.tog');
  if(b){setOpen(b,!isOpen(b));syncNext()}
});
stage.addEventListener('change',e=>{if(e.target.type==='checkbox'){state.done[e.target.id]=e.target.checked;save();refresh()}});
stage.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.note!=null){const v=t.value.trim();if(v)state.notes[t.dataset.note]=v;else delete state.notes[t.dataset.note];save();
    const b=stage.querySelector(`[aria-controls="nt-${t.dataset.note}"]`);if(b)b.textContent='✎ Ghi chú'+(v?' •':'');}
  else if(t.dataset.pnote!=null){const v=t.value.trim();if(v)state.pnotes[t.dataset.pnote]=v;else delete state.pnotes[t.dataset.pnote];save();}
});
$('#all').onclick=()=>{togs(sel).forEach(b=>setOpen(b,true));syncNext()};
$('#none').onclick=()=>{togs(sel).forEach(b=>setOpen(b,false));syncNext()};
nextBtn.onclick=()=>{
  const b=togs(sel).find(x=>!isOpen(x));
  if(b){setOpen(b,true);b.scrollIntoView({block:'nearest',behavior:calm()?'auto':'smooth'});b.focus({preventScroll:true})}
  else if(sel<PHASES.length-1){select(sel+1,true);const f=togs(sel).find(x=>!isOpen(x));if(f)setOpen(f,true)}
  syncNext();
};

function refresh(){
  let total=0,done=0,grand=[0,0];
  const byPay={CD:[0,0],CR:[0,0],CC:[0,0]};
  PHASES.forEach((p,i)=>{
    let pt=0,pd=0,pc=[0,0];
    p.g.forEach((g,j)=>{
      let gd=0;
      g.k.forEach((k,x)=>{
        const c=costOf(k), a=amt(k);
        if(c){const pk=byPay[k.p||'CC'];pk[0]+=c[0];pk[1]+=c[1]}
        if(a){pc[0]+=a[0];pc[1]+=a[1]}
        const ce2=$(`[data-ci="${i}-${j}-${x}"]`);
        if(ce2){ce2.hidden=!a; if(a){ce2.textContent=rng(a[0],a[1])+(halfNow(k)?' ½':'');
          if(halfNow(k))ce2.title='Một nửa khoản chung, nửa kia bên nhà đối diện lo'; else ce2.removeAttribute('title');}}
        if(!visible(k))return;
        pt++;if(state.done[tid(k)]){pd++;gd++}
      });
      const nv=g.k.filter(visible).length;
      const el=$(`[data-gc="${i}-${j}"]`);if(el)el.textContent=nv?('Xong '+gd+'/'+nv+' việc'):'Không có việc của bên này';
    });
    total+=pt;done+=pd;grand=[grand[0]+pc[0],grand[1]+pc[1]];
    const ce=$(`[data-pc="${i}"]`);if(ce){ce.textContent=rng(pc[0],pc[1]);const btn=ce.closest('[data-cost]');if(btn)btn.hidden=!pc[1]}
    const te=$(`[data-tpc="${i}"]`);if(te){te.hidden=!pc[1];te.textContent=crng(pc[0],pc[1])}
    const de=$(`[data-pd="${i}"]`);if(de)de.textContent='Xong '+pd+'/'+pt+' việc';
    const st=$(`#track .stop[data-i="${i}"]`);if(st)st.style.setProperty('--p',pt?pd/pt*100:0);
  });
  $('#pbar').style.width=(total?done/total*100:0)+'%';
  window.__byPay=byPay;
  const sn={all:'cả hai bên',CD:'cô dâu và nhà gái',CR:'chú rể và nhà trai'}[state.side||'all'];
  const pk=state.side==='CD'?byPay.CD:state.side==='CR'?byPay.CR:null;
  const nq=PHASES.reduce((a,p)=>a+p.g.reduce((b,g)=>b+g.k.filter(k=>sideOf(k)==='?').length,0),0);
  const hf=[byPay.CC[0]/2,byPay.CC[1]/2];
  $('#sinfo').textContent='Đang xem việc của '+sn+(pk?' · mọi con số tiền trên trang đang là phần của bên này: lo riêng '+rng1(pk[0],pk[1])+', cộng một nửa khoản chung '+rng1(hf[0],hf[1])+', tổng '+rng1(pk[0]+hf[0],pk[1]+hf[1])+'. Dấu ½ là khoản chung đã chia đôi':'')+(nq?' · còn '+nq+' việc chưa phân, bấm dấu + để chọn người chủ trì':'');
  $('#ptext').textContent='Đã xong '+done+' trên '+total+' việc. Vòng xanh quanh mỗi bong bóng là phần đã xong của bước đó. Dấu tích và ghi chú được lưu lại, xem ô trạng thái phía trên để biết đang lưu riêng trên máy này hay đồng bộ giữa các máy.';
  const tlab={all:'Tổng dự kiến',CD:'Tổng nhà gái',CR:'Tổng nhà trai'}[state.side||'all'];
  $('#totalTxt').textContent=tlab+' '+n1(grand[0])+' – '+n1(grand[1])+' triệu';
}

/* ---------- đồng bộ giữa các máy ---------- */
const SHARED=['done','assign','notes','pnotes','tablesCR','tablesCD','hoiCR','hoiCD','dnCD','dnPrice','priceLo','priceHi','pair'];
const pickShared=()=>{const o={};SHARED.forEach(k=>{if(state[k]!==undefined)o[k]=state[k]});return o};
const sEl=()=>$('#sync');
const sMsg=(t,c)=>{const e=sEl();if(e){e.textContent=t;e.className='sbtn sync '+(c||'')}};
let dbDoc=null, applying=false, writing=false, queued=false, lastSent='', pushT=null, seeded=false;

function openGroups(){return new Set([...$$('#stage .kids.l2')].filter(e=>!e.hidden).map(e=>e.id))}
function restoreGroups(set){$$('#stage .tog').forEach(b=>{const id=b.getAttribute('aria-controls');if(id&&set.size)setOpen(b,set.has(id))});}

function applyRemote(d){
  const prevPair=state.pair;
  const og=openGroups(), sc=window.scrollY;
  applying=true;
  SHARED.forEach(k=>{if(d[k]!==undefined)state[k]=d[k]});
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  applying=false;
  lastSent=JSON.stringify(pickShared());
  if(state.pair!==prevPair)renderTrack();
  renderStage();restoreGroups(og);applyFilter();
  window.scrollTo(0,sc);
}

async function push(){
  if(!dbDoc||applying)return;
  const o=pickShared(), j=JSON.stringify(o);
  if(j===lastSent)return;
  if(writing){queued=true;return}
  writing=true;sMsg('☁️ Đang lưu…','wait');
  try{await dbDoc.set(o);lastSent=j;sMsg('☁️ Đã đồng bộ','on')}
  catch(e){sMsg('⚠️ Chưa lưu được lên mạng','')}
  writing=false;
  if(queued){queued=false;push()}
}
function schedulePush(){if(!dbDoc||applying)return;clearTimeout(pushT);pushT=setTimeout(push,700)}

const snapData=sn=>{try{if(!sn)return null;if(typeof sn.data==='function')return sn.data();if(sn.data&&typeof sn.data==='object')return sn.data;if(typeof sn==='object')return sn}catch(e){}return null};

async function initSync(){
  const C=window.claude;
  if(!C||typeof C.use!=='function'){sMsg('💻 Lưu trên máy này','off');return}
  let db=null; try{db=await C.use('db')}catch(e){db=null}
  if(!db){sMsg('💻 Lưu trên máy này','off');return}
  let doc=null; try{doc=db.doc('plan/state')}catch(e){doc=null}
  if(!doc||typeof doc.onSnapshot!=='function'){sMsg('💻 Lưu trên máy này','off');return}
  sMsg('☁️ Đang kết nối…','wait');
  let settled=false;
  const t=setTimeout(()=>{if(!settled)sMsg('💻 Lưu trên máy này','off')},10000);
  const onErr=()=>{settled=true;clearTimeout(t);sMsg('💻 Lưu trên máy này','off')};
  try{
    doc.onSnapshot(sn=>{
      settled=true;clearTimeout(t);
      dbDoc=doc;onSave=schedulePush;
      const d=snapData(sn);
      const has=d&&Object.keys(d).length;
      if(has){
        const ae=document.activeElement;
        if(ae&&ae.tagName==='TEXTAREA'){lastSent='';sMsg('☁️ Có thay đổi mới, bấm ra ngoài ô ghi chú để cập nhật','wait');
          ae.addEventListener('blur',()=>applyRemote(d),{once:true});return}
        applyRemote(d);sMsg('☁️ Đã đồng bộ','on');
      }else if(!seeded){seeded=true;lastSent='';push()}
    },onErr);
  }catch(e){onErr()}
}

sel=Math.max(nowIdx(),0);
$$('#sidebar .sbtn').forEach(x=>x.setAttribute('aria-pressed',x.dataset.side===(state.side||'all')));
renderTrack();renderStage();applyFilter();
initSync();
</script>
